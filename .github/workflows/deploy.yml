name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # GitHub Pages has no SPA rewrite, so a deep link like /vault would 404
      # on a hard refresh. Serving index.html as the 404 page lets the router
      # take over instead. The QR route stays on `/?s=…` so it still gets a
      # real 200.
      - run: cp dist/index.html dist/404.html
      # The 404 fallback renders the right page but answers with a 404 status.
      # That's fine for a stray URL and invisible to a person, but not for a
      # page something machine-readable has to fetch: App Store review checks
      # the privacy policy URL, and a crawler treats 404 as "gone". Giving the
      # real routes their own index.html means they answer 200.
      - name: Give real routes a 200
        run: |
          for route in privacy terms pricing roadmap reset signin vault vault/cards vault/breaks vault/wax vault/wants vault/data vault/settings; do
            mkdir -p "dist/$route"
            cp dist/index.html "dist/$route/index.html"
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
